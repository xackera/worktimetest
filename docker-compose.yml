services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: worktime
      POSTGRES_USER: worktime
      POSTGRES_PASSWORD: worktime
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: при первом запуске временный сервер инициализации слушает только unix-сокет
      # и без этого флага база считалась бы готовой слишком рано.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U worktime -d worktime"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=worktime;Username=worktime;Password=worktime"
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
